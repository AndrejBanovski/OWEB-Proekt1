  <body class="container py-3">
    <header class="text-center p-3 my-3">
      <h1>Травел Планер апп</h1>
      <p>Прашалник за импресии</p>
      <nav class="nav justify-content-center">
        <a class="nav-link" href="pochetnaStrana.html">Почетна страна</a>
        <a class="nav-link" href="galerija.html">Галерија</a>
        <a class="nav-link" href="blog.html">Блог</a>

      </nav>
    </header>

    <section class="p-3 my-3">
      <h2>Ваши импресии:</h2>
      <form>
        <div class="form-group">
          <label>1. Како ќе ја оцените апликацијата?</label><br />
          <label class="mr-2"
            ><input type="radio" name="ocenka" value="odlicno" /> Одлично</label
          >
          <label class="mr-2"
            ><input type="radio" name="ocenka" value="dobro" /> Добро</label
          >
          <label class="mr-2"
            ><input type="radio" name="ocenka" value="losho" /> Лошо</label
          >
        </div>

        <div class="form-group">
          <label>2. Дали ќе ја препорачате на пријатели?</label><br />
          <label class="mr-2"
            ><input type="radio" name="preporaka" value="da" /> Да</label
          >
          <label class="mr-2"
            ><input type="radio" name="preporaka" value="ne" /> Не</label
          >
        </div>

        <div class="form-group">
          <label>3. Дали ќе ја користите повторно?</label><br />
          <label class="mr-2"
            ><input type="radio" name="povtorno" value="da" /> Да</label
          >
          <label class="mr-2"
            ><input type="radio" name="povtorno" value="ne" /> Не</label
          >
        </div>

        <div class="form-group">
          <label for="predlozi">4. Дали имате предлози за подобрување?</label>
          <textarea
            id="predlozi"
            name="predlozi"
            class="form-control"
            rows="4"
          ></textarea>
        </div>

        <button type="submit" class="btn btn-custom">Испрати</button>
      </form>
    </section>
